[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokpack"
version = "0.1.0"
description = "Token-budgeted context packer for LLM agents — rank files, pack until budget, emit a reproducible manifest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rashed Hasan" }]
keywords = ["llm", "agents", "context", "tokens", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5"]
dev = ["pytest>=7.0"]

[project.scripts]
tokpack = "tokpack.cli:main"

[tool.setuptools.packages.find]
include = ["tokpack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
